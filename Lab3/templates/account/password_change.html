{% extends "base.html" %}
{% load i18n %}
{% load crispy_forms_tags %}

{% block title %}{% trans "Change Password" %} - TrainWise{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card">
            <div class="card-body">
                <h1 class="card-title text-center mb-4">{% trans "Change Password" %}</h1>

                <form method="POST" action="{% url 'account_change_password' %}" class="password_change">
                    {% csrf_token %}
                    {{ form|crispy }}
                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-primary">{% trans "Change Password" %}</button>
                    </div>
                </form>

                <div class="mt-4 text-center">
                    <a href="{% url 'account_reset_password' %}" class="link-secondary">{% trans "Forgot Password?" %}</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
