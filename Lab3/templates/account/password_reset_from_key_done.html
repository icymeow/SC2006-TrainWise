{% extends "base.html" %}
{% load i18n %}

{% block title %}{% trans "Change Password" %} - TrainWise{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card">
            <div class="card-body text-center">
                <h1 class="card-title mb-4">{% trans "Change Password" %}</h1>
                <div class="alert alert-success mb-4">
                    <p class="mb-0">{% trans 'Your password is now changed.' %}</p>
                </div>
                <a href="{% url 'account_login' %}" class="btn btn-primary">{% trans "Sign In" %}</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
